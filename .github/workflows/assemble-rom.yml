name: Assemble Medemblik ROM
on:
  push:
    paths:
      - 'dist/zlib_b64/**'
      - '.github/workflows/assemble-rom.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inflate ROM from zlib_b64 parts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zlib, base64, hashlib
          parts = sorted(pathlib.Path('dist/zlib_b64').glob('*.txt'))
          assert len(parts) == 6, parts
          b64 = ''.join(p.read_text().strip() for p in parts)
          # Fix known single-char MCP transcription errors in parts 02/03
          b64 = b64.replace('AcWIh3rCj32PnQf', 'AcWIh3rCJ32PnQf', 1)
          b64 = b64.replace('Sd66rc3KaRpqPTTc', 'Sd66rc3KaRqdPTTc', 1)
          raw = zlib.decompress(base64.b64decode(b64))
          assert len(raw) == 524288, len(raw)
          expect = '0271b2649d10853604f1c868366e894bbe987b123dc5858f3b0878c561e6a12d'
          got = hashlib.sha256(raw).hexdigest()
          assert got == expect, got
          pathlib.Path('dist/medemblik.rom').write_bytes(raw)
          print('parts', len(parts), 'wrote', len(raw), 'sha256', got)
          PY
      - name: Commit ROM if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/medemblik.rom
          if git diff --staged --quiet; then
            echo "No ROM changes"
          else
            git commit -m "Add Screen 7 ASCII16 Medemblik ROM (512KB)"
            git push
          fi
