name: Assemble ROM from zlib_b64

on:
  push:
    paths:
      - 'dist/zlib_b64/**'
      - 'dist/SHA256.txt'
      - '.github/workflows/assemble-rom.yml'
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble medemblik.rom from zlib_b64 chunks
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, zlib, hashlib
          from pathlib import Path

          chunk_dir = Path('dist/zlib_b64')
          chunks = sorted(chunk_dir.glob('*.txt'))
          if not chunks:
              raise SystemExit('no zlib_b64 chunks found')
          b64 = ''.join(p.read_text().strip() for p in chunks)
          rom = zlib.decompress(base64.b64decode(b64, validate=True))
          out = Path('dist/medemblik.rom')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(rom)
          digest = hashlib.sha256(rom).hexdigest()
          expected = Path('dist/SHA256.txt').read_text().strip().split()[0]
          print(f'chunks={len(chunks)} size={len(rom)} sha256={digest}')
          if digest != expected:
              raise SystemExit(f'SHA256 mismatch: got {digest}, expected {expected}')
          print('SHA256 OK')
          PY

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: medemblik-rom
          path: dist/medemblik.rom
